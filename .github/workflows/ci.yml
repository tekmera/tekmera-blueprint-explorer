name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install black isort mypy flake8 types-requests
    
    - name: Run code formatting
      run: |
        black src tests
        isort src tests
    
    - name: Check for formatting changes
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "❌ Code was not properly formatted. Run 'black src tests && isort src tests' locally."
          git diff
          exit 1
        else
          echo "✅ Code is properly formatted"
        fi
    
    - name: Run type checking (allow failures for now)
      continue-on-error: true
      run: |
        mypy src/tekmera --ignore-missing-imports
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=tekmera --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint-and-security:
    name: Linting and Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install bandit flake8
    
    - name: Run security scan with bandit
      run: |
        bandit -r src/ -f json -o bandit-report.json -ll || bandit_exit=$?
        if [[ $bandit_exit -eq 1 ]]; then
          echo "❌ High severity security issues found"
          exit 1
        fi
        echo "✅ No high severity security issues found"
    
    - name: Run linting
      run: |
        flake8 src/ --max-line-length=100 --extend-ignore=E203,W503
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: bandit-report.json
        retention-days: 30

  build-test:
    name: Test Binary Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            binary_name: tekmera-test-linux
          - os: macos-latest
            platform: macos
            binary_name: tekmera-test-macos
          - os: windows-latest
            platform: windows
            binary_name: tekmera-test-windows.exe
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pyinstaller
    
    - name: Test PyInstaller build
      run: |
        pyinstaller --onefile --name ${{ matrix.binary_name }} src/tekmera/interfaces/cli/main.py
    
    - name: Test binary execution
      shell: bash
      run: |
        if [[ "${{ matrix.platform }}" == "windows" ]]; then
          ./dist/${{ matrix.binary_name }} --version
        else
          ./dist/${{ matrix.binary_name }} --version
        fi
    
    - name: Upload test binary
      uses: actions/upload-artifact@v4
      with:
        name: test-binary-${{ matrix.platform }}
        path: dist/${{ matrix.binary_name }}
        retention-days: 7

  license-validation:
    name: License Integration Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Test license manager integration
      run: |
        python -c "
        import sys, os
        sys.path.insert(0, 'src')
        
        # Test license manager imports
        from tekmera.infra.license import license_manager
        from tekmera.infra.license_ui import LicenseUI
        
        print('✅ License components imported successfully')
        
        # Test license info retrieval (should work in free mode)
        info = license_manager.get_license_info()
        print(f'✅ License info retrieved: {info[\"status\"]}')
        
        # Test CLI license commands are wired up
        from tekmera.interfaces.cli.main import cli
        license_cmd = cli.commands.get('license')
        assert license_cmd is not None, 'License command not found'
        
        subcommands = list(license_cmd.commands.keys())
        expected = ['activate', 'deactivate', 'status']
        for cmd in expected:
            assert cmd in subcommands, f'Missing subcommand: {cmd}'
        
        print('✅ All license CLI commands are properly wired')
        print('🎉 License integration validation complete')
        "

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit
    
    - name: Run dependency audit
      run: |
        pip-audit --desc --format=json --output=audit-report.json . || audit_exit=$?
        pip-audit --desc .
        if [[ $audit_exit -ne 0 ]]; then
          echo "❌ Security vulnerabilities found in dependencies"
          exit 1
        fi
    
    - name: Upload audit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-audit-report
        path: audit-report.json
        retention-days: 30